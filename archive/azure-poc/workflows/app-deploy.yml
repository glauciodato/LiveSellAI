name: Deploy app to Azure Static Web Apps

# Builda o app Expo pra Web (exportação estática) e publica no Azure Static
# Web Apps (livesellai-poc-app), a cada push que mude poc-v1/app. A URL do
# backend é embutida no bundle em tempo de build (variáveis EXPO_PUBLIC_*
# do Expo são "queimadas" no JS, não lidas em runtime).

on:
  push:
    branches: [main]
    paths:
      - "poc-v1/app/**"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch: {}

env:
  APP_DIR: poc-v1/app
  # Backend real já implantado no Azure (ver poc-v1/backend).
  EXPO_PUBLIC_BACKEND_URL: https://livesellai-poc-backend.azurewebsites.net/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          cd '${{ env.APP_DIR }}'
          npm ci

      - name: Exportar build estático (Web)
        run: |
          cd '${{ env.APP_DIR }}'
          npx expo export --platform web --output-dir dist

      - name: Deploy no Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "${{ env.APP_DIR }}/dist"
          output_location: ""
          skip_app_build: true
