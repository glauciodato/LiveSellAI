name: Build & push avatar-service image

# Builda a imagem Docker do serviço de geração de avatar (MuseTalk + F5-TTS)
# e publica no GitHub Container Registry (GHCR). A imagem publicada é
# referenciada diretamente no provedor de GPU (ex: Vast.ai, RunPod) -- eles
# não fazem o build a partir do Dockerfile, só rodam a imagem já pronta.
#
# Imagem publicada em: ghcr.io/<owner>/<repo>/avatar-service:<tag>

on:
  push:
    branches: [main]
    paths:
      - "poc-v1/avatar-service/**"
      - ".github/workflows/avatar-service-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/avatar-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: poc-v1/avatar-service
          file: poc-v1/avatar-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
