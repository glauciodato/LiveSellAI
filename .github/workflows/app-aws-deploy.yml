name: Build & deploy app (S3 + CloudFront)

# Builda o app Expo pra Web (exportação estática) e publica em S3 +
# CloudFront na AWS, a cada push que mude poc-v1/app. Roda em paralelo ao
# deploy existente pro Azure Static Web Apps (app-deploy.yml) -- mesmo
# código-fonte, dois destinos.
#
# A partir da Fase 5 (corte final), aponta pro backend novo na AWS (ECS
# atrás de um CloudFront, que dá HTTPS pro ALB sem precisar de domínio
# próprio) -- não mais pro Azure. O deploy do Azure continua intocado,
# apontando pro backend Azure, até a Fase 6 (decomissionamento).
#
# Autenticação via OIDC, mesmo princípio do deploy do backend-aws.

on:
  push:
    branches: [main]
    paths:
      - "poc-v1/app/**"
      - ".github/workflows/app-aws-deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_DIR: poc-v1/app
  EXPO_PUBLIC_BACKEND_URL: https://d16g9ew6niffa5.cloudfront.net/api
  EXPO_PUBLIC_GOOGLE_CLIENT_ID: 388037318755-3h9ou8n4fcs7a0ilg3t2pj4l8d1r1d8j.apps.googleusercontent.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          cd "$APP_DIR"
          npm ci

      - name: Exportar build estático (Web)
        run: |
          cd "$APP_DIR"
          npx expo export --platform web --output-dir dist

      - name: Login na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync pro S3
        run: |
          aws s3 sync "$APP_DIR/dist" "s3://${{ secrets.AWS_FRONTEND_S3_BUCKET }}" --delete

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
